<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <title>ADopera</title>
</head>
<body>
    <Header>
        <Div class="Logo_y_titulo">
            <Div class="Logo"></Div>
            <h2 class="titulo">ADOpera</h2>
        </Div>
    </Header>

    <div class="seccionFormulario">
        <div class="contenedorFormulario">  
            <form  id="formLogin" class="formulario">
                    <legend>Inicio de sesión</legend>

                    <label>Correo electrónico</label>
                    <input type="email" name="correo" required>

                    <label>Contraseña</label>
                    <input type="password" name="contraseña" required>

                    <div class="contenedor_Botones">
                        <button type="button" onclick="location.href='index.html'" class="boton_inicio_sesion">Volver</button>
                        <button type="submit" class="boton_inicio_sesion">Iniciar sesión</button>
                    </div>
                    <div>
                        
                        <a href="Login.html">Registrarme</a>

                    </div>
            </form>
        </div>       
    </div>   
    <script src="ScripInicioSesion.js"></script>
    <link rel="stylesheet" href="StyleInicioSesion.css"> 
</body>
</html>
